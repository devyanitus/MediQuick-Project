<!DOCTYPE html>
<html>
<head>
    <title>Login - MediQuick</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Enter Email" required>
        <input type="password" id="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        fetch("http://localhost:8091/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Invalid credentials");
                }
                return response.text();   // because your backend returns token as String
            })
            .then(token => {

                // Save JWT in browser
                localStorage.setItem("jwt", token);

                // Redirect THROUGH GATEWAY
                window.location.href = "http://localhost:8091/consultants/home.html";
            })
            .catch(error => {
                alert("Login failed!");
                console.error(error);
            });
    });
</script>

</body>
</html>
