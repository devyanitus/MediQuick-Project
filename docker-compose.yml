services:

  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mediquick_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql

  mysql-consultant:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mediquick_consultant_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_consultant_data:/var/lib/mysql

  config-server:
    image: config-server:latest
    ports:
      - "8888:8888"

  eureka-server:
    image: eureka-server:latest
    depends_on:
      - config-server
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    restart: on-failure

  auth-service:
    image: auth-service:latest
    depends_on:
      - mysql-auth
      - eureka-server
      - config-server
    ports:
      - "8085:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/mediquick_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    restart: on-failure

  consultant-service:
    image: consultant-service:latest
    depends_on:
      - mysql-consultant
      - eureka-server
      - config-server
    ports:
      - "8086:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-consultant:3306/mediquick_consultant_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    restart: on-failure

  api-gateway:
    image: api-gateway:latest
    depends_on:
      - eureka-server
      - auth-service
      - consultant-service
      - config-server
    ports:
      - "8091:8091"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    restart: on-failure

volumes:
  mysql_auth_data:
  mysql_consultant_data: