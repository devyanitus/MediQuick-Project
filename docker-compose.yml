version: '3.8'

services:

  config-server:
    image: sid118/config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"

  eureka-server:
    image: sid118/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  auth-db:
    image: mysql:8
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: mediquick_db
    ports:
      - "3307:3306"

  consultant-db:
    image: mysql:8
    container_name: consultant-db
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: mediquick_consultant_db
    ports:
      - "3308:3306"

  auth-service:
    image: sid118/auth-service:latest
    container_name: auth-service
    depends_on:
      - eureka-server
      - config-server
      - auth-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/mediquick_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  consultant-service:
    image: sid118/consultant-service:latest
    container_name: consultant-service
    depends_on:
      - eureka-server
      - config-server
      - consultant-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://consultant-db:3306/mediquick_consultant_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  api-gateway:
    image: sid118/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8091:8091"
    depends_on:
      - eureka-server
      - auth-service
      - consultant-service