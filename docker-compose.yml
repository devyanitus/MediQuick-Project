version: '3.8'

services:
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mediquick_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql

  eureka-server:
    image: eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"

  auth-service:
    image: auth-service:latest
    container_name: auth-service
    depends_on:
      - mysql-auth
      - eureka-server
    ports:
      - "8085:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/mediquick_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  mysql-consultant:
    image: mysql:8.0
    container_name: mysql-consultant
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mediquick_consultant_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_consultant_data:/var/lib/mysql

  consultant-service:
    image: consultant-service:latest
    container_name: consultant-service
    depends_on:
      - mysql-consultant
      - eureka-server
    ports:
      - "8086:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-consultant:3306/mediquick_consultant_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
volumes:
  mysql_auth_data:
  mysql_consultant_data: