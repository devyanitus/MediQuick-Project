server.port=8091
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=consultant-service
spring.cloud.gateway.routes[1].uri=lb://consultant-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/consultants/**

#spring.main.web-application-type=reactive

#jwt.secret=mediquickSuperSecretKeyForJwtGeneration123456